<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidentes - IncidentSmartManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-shield-alt"></i>
            <span>ISM</span>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="incidentes.html"><i class="fas fa-exclamation-triangle"></i> Incidentes</a></li>
            <li class="nav-item"><a class="nav-link" href="registrar.html"><i class="fas fa-plus-circle"></i> Registrar Incidente</a></li>
            <li class="nav-item" id="navUsuarios"><a class="nav-link" href="usuarios.html"><i class="fas fa-users"></i> Usuarios</a></li>
            <li class="nav-item"><a class="nav-link" href="reportes.html"><i class="fas fa-chart-bar"></i> Reportes</a></li>
            <li class="nav-item mt-auto"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <nav class="top-navbar">
            <div class="d-flex align-items-center">
                <button class="btn btn-link" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <h4 class="mb-0 ms-3">Gestión de Incidentes</h4>
            </div>
            <div class="d-flex align-items-center">
                <span class="me-3"><i class="fas fa-user-circle me-1"></i><span id="userName">Usuario</span></span>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <!-- Filtros -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <input type="text" class="form-control" id="filterSearch" placeholder="🔍 Buscar incidente...">
                        </div>
                        <div class="col-md-2">
                            <select class="form-select" id="filterEstado">
                                <option value="">Todos los estados</option>
                                <option value="abierto">Abierto</option>
                                <option value="en_proceso">En Proceso</option>
                                <option value="resuelto">Resuelto</option>
                                <option value="cerrado">Cerrado</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select" id="filterPrioridad">
                                <option value="">Todas las prioridades</option>
                                <option value="critica">Crítica</option>
                                <option value="alta">Alta</option>
                                <option value="media">Media</option>
                                <option value="baja">Baja</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select" id="filterCategoria">
                                <option value="">Todas las categorías</option>
                                <option value="hardware">Hardware</option>
                                <option value="software">Software</option>
                                <option value="red">Red</option>
                                <option value="seguridad">Seguridad</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-outline-primary w-100" onclick="filterIncidents()">
                                <i class="fas fa-filter me-1"></i> Filtrar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de Incidentes -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5><i class="fas fa-exclamation-triangle me-2"></i>Lista de Incidentes</h5>
                    <a href="registrar.html" class="btn btn-primary">
                        <i class="fas fa-plus me-1"></i> Nuevo Incidente
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Título</th>
                                    <th>Categoría</th>
                                    <th>Prioridad</th>
                                    <th>Estado</th>
                                    <th>Asignado a</th>
                                    <th>Fecha</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="incidentsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/database.js"></script>
    <script src="js/incidentes.js"></script>
</body>
</html>
