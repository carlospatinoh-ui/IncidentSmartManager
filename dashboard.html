<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ISM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-shield-alt"></i>
            <span>ISM</span>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="dashboard.html">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="incidentes.html">
                    <i class="fas fa-exclamation-triangle"></i> Incidentes
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="registrar.html">
                    <i class="fas fa-plus-circle"></i> Registrar
                </a>
            </li>
            <li class="nav-item" id="navUsuarios">
                <a class="nav-link" href="usuarios.html">
                    <i class="fas fa-users"></i> Usuarios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="reportes.html">
                    <i class="fas fa-chart-bar"></i> Reportes
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-content">
        <nav class="top-navbar">
            <h4>Dashboard</h4>
            <div>
                <span class="me-2">
                    <i class="fas fa-user-circle me-1"></i>
                    <span id="userName">Usuario</span>
                    <span class="badge bg-primary" id="userRole">Rol</span>
                </span>
            </div>
        </nav>

        <div class="container-fluid p-2">
            <div class="row g-2 mb-2">
                <div class="col-xl-3 col-md-6">
                    <div class="kpi-card kpi-total">
                        <div class="kpi-icon"><i class="fas fa-folder-open"></i></div>
                        <div class="kpi-info">
                            <h3 id="kpiTotal">0</h3>
                            <p>Total</p>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="kpi-card kpi-abiertos">
                        <div class="kpi-icon"><i class="fas fa-clock"></i></div>
                        <div class="kpi-info">
                            <h3 id="kpiAbiertos">0</h3>
                            <p>Abiertos</p>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="kpi-card kpi-proceso">
                        <div class="kpi-icon"><i class="fas fa-spinner"></i></div>
                        <div class="kpi-info">
                            <h3 id="kpiProceso">0</h3>
                            <p>En Proceso</p>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="kpi-card kpi-cerrados">
                        <div class="kpi-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="kpi-info">
                            <h3 id="kpiCerrados">0</h3>
                            <p>Resueltos</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-lg-6">
                    <div class="card chart-card">
                        <div class="card-header">
                            <h5><i class="fas fa-chart-pie me-2"></i>Por Estado</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="chartEstado"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card chart-card">
                        <div class="card-header">
                            <h5><i class="fas fa-chart-bar me-2"></i>Por Prioridad</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="chartPrioridad"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5><i class="fas fa-list me-2"></i>Recientes</h5>
                            <a href="incidentes.html" class="btn btn-sm btn-outline-primary">Ver todos</a>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Título</th>
                                            <th>Prioridad</th>
                                            <th>Estado</th>
                                            <th>Fecha</th>
                                        </tr>
                                    </thead>
                                    <tbody id="recentIncidents"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/database.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
