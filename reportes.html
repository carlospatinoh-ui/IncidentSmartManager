<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - ISM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-shield-alt"></i>
            <span>ISM</span>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="incidentes.html"><i class="fas fa-exclamation-triangle"></i> Incidentes</a></li>
            <li class="nav-item"><a class="nav-link" href="registrar.html"><i class="fas fa-plus-circle"></i> Registrar</a></li>
            <li class="nav-item" id="navUsuarios"><a class="nav-link" href="usuarios.html"><i class="fas fa-users"></i> Usuarios</a></li>
            <li class="nav-item"><a class="nav-link active" href="reportes.html"><i class="fas fa-chart-bar"></i> Reportes</a></li>
            <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <nav class="top-navbar">
            <h4>Reportes</h4>
            <div><span id="userName">Usuario</span></div>
        </nav>

        <div class="container-fluid p-2">
            <div class="row g-2 mb-2">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body py-2">
                            <i class="fas fa-check-circle text-success mb-1"></i>
                            <h5 id="reportResueltos" class="mb-0">0</h5>
                            <small class="text-muted">Resueltos hoy</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body py-2">
                            <i class="fas fa-clock text-warning mb-1"></i>
                            <h5 id="reportTiempoProm" class="mb-0">0h</h5>
                            <small class="text-muted">Tiempo promedio</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body py-2">
                            <i class="fas fa-fire text-danger mb-1"></i>
                            <h5 id="reportCriticos" class="mb-0">0</h5>
                            <small class="text-muted">Críticos</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body py-2">
                            <i class="fas fa-percentage text-primary mb-1"></i>
                            <h5 id="reportSLA" class="mb-0">0%</h5>
                            <small class="text-muted">Cumplimiento SLA</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-lg-6">
                    <div class="card chart-card">
                        <div class="card-header"><h5><i class="fas fa-chart-line me-2"></i>Tendencia (7 días)</h5></div>
                        <div class="card-body"><canvas id="chartTendencia"></canvas></div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card chart-card">
                        <div class="card-header"><h5><i class="fas fa-chart-doughnut me-2"></i>Por Categoría</h5></div>
                        <div class="card-body"><canvas id="chartCategoria"></canvas></div>
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-lg-6">
                    <div class="card chart-card">
                        <div class="card-header"><h5><i class="fas fa-chart-bar me-2"></i>Por Técnico</h5></div>
                        <div class="card-body"><canvas id="chartTecnico"></canvas></div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card chart-card">
                        <div class="card-header"><h5><i class="fas fa-chart-pie me-2"></i>Por Prioridad</h5></div>
                        <div class="card-body"><canvas id="chartPrioridadReport"></canvas></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5><i class="fas fa-table me-2"></i>Resumen</h5>
                    <button class="btn btn-sm btn-outline-success" onclick="exportReport()">
                        <i class="fas fa-download me-1"></i> Exportar CSV
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped mb-0">
                            <thead>
                                <tr><th>Métrica</th><th>Valor</th><th>Estado</th></tr>
                            </thead>
                            <tbody id="reportTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/database.js"></script>
    <script src="js/reportes.js"></script>
</body>
</html>
