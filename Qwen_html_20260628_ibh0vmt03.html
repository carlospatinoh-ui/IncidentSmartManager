<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Incidente - IncidentSmartManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-shield-alt"></i>
            <span>ISM</span>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="incidentes.html"><i class="fas fa-exclamation-triangle"></i> Incidentes</a></li>
            <li class="nav-item"><a class="nav-link active" href="registrar.html"><i class="fas fa-plus-circle"></i> Registrar Incidente</a></li>
            <li class="nav-item" id="navUsuarios"><a class="nav-link" href="usuarios.html"><i class="fas fa-users"></i> Usuarios</a></li>
            <li class="nav-item"><a class="nav-link" href="reportes.html"><i class="fas fa-chart-bar"></i> Reportes</a></li>
            <li class="nav-item mt-auto"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <nav class="top-navbar">
            <div class="d-flex align-items-center">
                <button class="btn btn-link" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <h4 class="mb-0 ms-3">Registrar Incidente</h4>
            </div>
            <div class="d-flex align-items-center">
                <span class="me-3"><i class="fas fa-user-circle me-1"></i><span id="userName">Usuario</span></span>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-plus-circle me-2"></i>Nuevo Incidente</h5>
                        </div>
                        <div class="card-body">
                            <form id="incidentForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Título del incidente *</label>
                                        <input type="text" class="form-control" id="incTitle" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Categoría *</label>
                                        <select class="form-select" id="incCategory" required>
                                            <option value="">Seleccionar...</option>
                                            <option value="hardware">Hardware</option>
                                            <option value="software">Software</option>
                                            <option value="red">Red</option>
                                            <option value="seguridad">Seguridad</option>
                                            <option value="otro">Otro</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Prioridad *</label>
                                        <select class="form-select" id="incPriority" required>
                                            <option value="">Seleccionar...</option>
                                            <option value="critica">🔴 Crítica</option>
                                            <option value="alta">🟠 Alta</option>
                                            <option value="media">🟡 Media</option>
                                            <option value="baja">🟢 Baja</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Sistema afectado *</label>
                                        <input type="text" class="form-control" id="incSystem" placeholder="Ej: Servidor principal, ERP, etc." required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Asignar a</label>
                                        <select class="form-select" id="incAssigned">
                                            <option value="">Sin asignar</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Ubicación</label>
                                        <input type="text" class="form-control" id="incLocation" placeholder="Ej: Oficina 301, Piso 2">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Descripción detallada *</label>
                                    <textarea class="form-control" id="incDescription" rows="4" required placeholder="Describa el incidente con el mayor detalle posible..."></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Evidencias / Notas adicionales</label>
                                    <textarea class="form-control" id="incEvidence" rows="3" placeholder="Adjunte capturas de pantalla, logs, o información adicional..."></textarea>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <a href="incidentes.html" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-1"></i> Volver
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-1"></i> Registrar Incidente
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/database.js"></script>
    <script src="js/incidentes.js"></script>
</body>
</html>
